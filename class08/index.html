<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework class 08</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Hero section -->
    <section class="bg-dark py-5 text-center">
      <div class="container">
        <h1 class="display-3 mb-2 text-white">Dashboard</h1>
        <p class="text-warning">
          Dashboard that loads users from an external API and displays related
          posts for each user
        </p>
        <button id="load-post">Load Users</button>
        <button id="clear">Clear all info</button>
      </div>
    </section>

    <!-- Status section -->
    <section class="alert alert-success">
      <div class="container">
        <p id="status"></p>
      </div>
    </section>

    <section class="">
      <div class="container">
        <div id="output"></div>
      </div>
    </section>
    <script src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
