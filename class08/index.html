<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework class 08</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <main id="app">
      <!-- Hero section -->
      <section class="bg-dark py-5 text-center">
        <div class="container">
          <h1 class="display-3 mb-2 text-white">Dashboard</h1>
          <p class="text-warning">
            Dashboard that loads users from an external API and displays related
            posts for each user
          </p>
          <button id="load-post">Load Users</button>
          <button id="clear">Clear all info</button>
        </div>
      </section>

      <!-- Status section -->
      <section class="alert">
        <div class="container">
          <p class="text-center" id="status">Ready</p>
        </div>
      </section>

      <!-- User card section -->
      <section id="user-profile">
        <div class="container">
          <h4 class="display-5 mb-2 text-center">Profile Information</h4>
          <div class="row row-cols-1 row-cols-md-3 g-4" id="output"></div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
